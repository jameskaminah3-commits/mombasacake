name: Deploy to Railway

# Railway deploys the app itself whenever main changes (its GitHub connection; see watchPatterns in
# railway.toml), so this workflow no longer runs on every push, where it failed without a token and would
# otherwise deploy each commit twice. It stays as a manual fallback: add a RAILWAY_TOKEN (project token)
# or RAILWAY_API_TOKEN secret, then use "Run workflow" on the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: railway-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT: ${{ secrets.RAILWAY_PROJECT }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail

          token="${RAILWAY_TOKEN:-${RAILWAY_API_TOKEN:-}}"

          if [ -z "$token" ]; then
            echo "Missing Railway token secret."
            echo "Add GitHub secret RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account/workspace token)."
            exit 1
          fi

          export RAILWAY_TOKEN="$token"
          unset RAILWAY_API_TOKEN

          args=(up --ci)

          if [ -n "${RAILWAY_PROJECT:-}" ]; then
            args+=(--project "$RAILWAY_PROJECT")
          fi

          if [ -n "${RAILWAY_ENVIRONMENT:-}" ]; then
            args+=(--environment "$RAILWAY_ENVIRONMENT")
          fi

          if [ -n "${RAILWAY_SERVICE:-}" ]; then
            args+=(--service "$RAILWAY_SERVICE")
          fi

          railway "${args[@]}"
