kind = "web"
previewPath = "/"
title = "Cake Shop"
version = "1.0.0"
id = "artifacts/cakeshop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18408

[services.development]
run = "pnpm --filter @workspace/cakeshop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cakeshop", "run", "build" ]
publicDir = "artifacts/cakeshop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18408"
BASE_PATH = "/"
